services:
  postgres:
    image: postgres:16
    container_name: sql_rag_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: customer_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  neo4j:
    image: neo4j:5
    container_name: graph_rag_neo4j
    environment:
      NEO4J_AUTH: neo4j/neo4j_password
      # APOC is required for LangChain's Neo4jGraph schema introspection (apoc.meta.data)
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_security_procedures_allowlist: apoc.*
    ports:
      - "7474:7474"   # Neo4j Browser (http://localhost:7474)
      - "7687:7687"   # Bolt protocol (used by the notebook)
    volumes:
      - neo4jdata:/data

volumes:
  pgdata:
  neo4jdata:
